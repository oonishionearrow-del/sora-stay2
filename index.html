<!DOCTYPE html>
<html>
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="color-scheme" content="light only">

    <title>SORA</title>

    <style>

        :root {
            color-scheme: light only;
        }

        * {
            box-sizing: border-box;
        }


        /* =========================
           ページ全体
        ========================= */

        body {
            margin: 0;
            min-height: 100vh;

            background: #000;

            font-family: "Yu Mincho", "Hiragino Mincho ProN", serif;

            color: white;

            position: relative;
        }


        /* =========================
           背景写真
           写真だけじわーっと表示
        ========================= */

        body::after {
            content: "";

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background-image: url("images/main.jpg");

            background-size: cover;

            background-position: center;

            opacity: 0;

            animation: backgroundFade 4s ease forwards;

            z-index: -2;
        }


        @keyframes backgroundFade {

            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }

        }


        /* =========================
           背景を少し暗くする
           最後はこの明るさで停止
        ========================= */

        body::before {
            content: "";

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background: rgba(0, 0, 0, 0.25);

            z-index: -1;
        }


        /* =========================
           左上のロゴ
        ========================= */

        .logo {
            position: absolute;

            top: 30px;
            left: 50px;

            width: 250px;

            opacity: 1;
        }


        /* =========================
           ようこそ
        ========================= */

        .welcome {
            position: absolute;

            top: 50%;
            left: 20%;

            transform: translateY(-50%);

            font-size: 38px;

            letter-spacing: 10px;

            text-shadow:
                0 2px 8px rgba(0, 0, 0, 0.5);
        }


        /* =========================
           右上の予約＋三本線
        ========================= */

        .top-menu {
            position: fixed;

            top: 30px;
            right: 35px;

            display: flex;

            align-items: center;

            gap: 15px;

            z-index: 20;
        }


        /* ご予約はこちら */

        .reservation {
            color: white;

            text-decoration: none;

            padding: 12px 20px;

            background: rgba(0, 40, 60, 0.75);

            border: 1px solid rgba(255, 255, 255, 0.6);

            border-radius: 30px;

            font-size: 13px;

    letter-spacing: 2px;

    backdrop-filter: blur(5px);

    transition: 0.3s;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    line-height: 1.1;
}


        /* 予約ボタンにマウスを乗せたとき */

        .reservation:hover {
            background: rgba(0, 40, 60, 0.95);
        }


        /* =========================
           三本線
        ========================= */

        .menu-button {
            width: 45px;
            height: 45px;

            border: none;

            background: rgba(0, 40, 60, 0.75);

            color: white;

            font-size: 28px;

            cursor: pointer;

            border-radius: 50%;

            backdrop-filter: blur(5px);
        }


        /* =========================
           メニュー
        ========================= */

        .menu {
            position: fixed;

            top: 0;

            right: -300px;

            width: 300px;

            height: 100vh;

            background: rgba(0, 40, 60, 0.92);

            padding: 100px 40px 40px;

            transition: right 0.4s ease;

            z-index: 30;
        }


        /* メニューが開いたとき */

        .menu.open {
            right: 0;
        }


        /* =========================
           メニュー項目
        ========================= */

        .menu a {
            display: block;

            color: white;

            text-decoration: none;

            font-size: 18px;

            letter-spacing: 4px;

            padding: 18px 0;

            border-bottom:
                1px solid rgba(255, 255, 255, 0.3);

            transition: 0.3s;
        }


        /* メニューにマウスを乗せたとき */

        .menu a:hover {
            padding-left: 10px;

            background: rgba(255, 255, 255, 0.08);
        }


        /* =========================
           閉じるボタン
        ========================= */

        .close {
            position: absolute;

            top: 30px;

            right: 35px;

            font-size: 30px;

            cursor: pointer;
        }


        /* =========================
           スマホ
        ========================= */

@media (max-width: 800px) {

    .logo {
        width: 120px;
        top: 20px;
        left: 20px;
    }

 .welcome {
    position: absolute;
    top: 200px;
    bottom: auto;
    left: 10%;

    transform: none;

    font-size: 20px;
    letter-spacing: 4px;
}

    .top-menu {
        top: 20px;
        right: 20px;
        gap: 8px;
    }

    .reservation {
        padding: 10px 14px;
        font-size: 12px;
    }

    .menu-button {
        width: 42px;
        height: 42px;
        font-size: 25px;
    }

    .menu {
        width: 220px;
    }

    /* 背景写真をスクロールで流れる形にする
       （スクロールしても付いてこないように） */
    body::after,
    body::before {
        position: absolute;
        height: 100vh;
    }

    /* スマホは端末によってフェード演出が
       途中で止まることがあるため、
       最初から表示する */
    body::after {
        opacity: 1;
        animation: none;
    }

    /* ようこそ画面をフルで見せてから
       下にconcept以降を続ける */
    #mobile-sections {
        margin-top: 100vh;
    }

}
    </style>

</head>


<body>


    <!-- 左上のロゴ -->

    <img
        src="images/logo.png"
        alt="SORAのロゴ"
        class="logo"
    >


    <!-- ようこそ -->

    <div class="welcome">

        ようこそ SORA へ

    </div>


    <!-- 右上：予約＋三本線 -->

    <div class="top-menu">


        <!-- 予約 -->

        <a
            href="https://www.airbnb.jp/rooms/1693227146127960935?unique_share_id=e607aecd-bd02-41de-9335-cc84bdbd2808&viralityEntryPoint=1&s=76"
            class="reservation"
            target="_blank"
        >
             <span>ご予約はこちら</span>
    <small>RESERVATION</small>
        </a>


        <!-- 三本線 -->

        <button
            class="menu-button"
            onclick="openMenu()"
        >

            ☰

        </button>

    </div>


    <!-- メニュー -->

    <div
        class="menu"
        id="menu"
    >


        <!-- 閉じる -->

        <div
            class="close"
            onclick="closeMenu()"
        >

            ×

        </div>


        <a href="concept.html">
            CONCEPT
        </a>


        <a href="room.html">
            ROOM
        </a>


        <a href="amenities.html">
            AMENITIES
        </a>


        <a href="access.html">
            ACCESS
        </a>

<a href="contact.html">
    CONTACT
</a>


        <a
            href="https://www.airbnb.jp/rooms/1693227146127960935?unique_share_id=e607aecd-bd02-41de-9335-cc84bdbd2808&viralityEntryPoint=1&s=76"
            target="_blank"
        >
            RESERVATION
        </a>


    </div>


    <!-- =========================
         スマホだけ：この下に
         CONCEPT〜CONTACTを
         連結して表示する場所
    ========================= -->

    <div id="mobile-sections"></div>


    <script>


        /* =========================
           メニューを開く
        ========================= */

        function openMenu() {

            document
                .getElementById("menu")
                .classList
                .add("open");

        }


        /* =========================
           メニューを閉じる
        ========================= */

        function closeMenu() {

            document
                .getElementById("menu")
                .classList
                .remove("open");

        }


    </script>


    <!-- =========================
         スマホ版：他ページを
         このページの下に連結する
    ========================= -->

    <script>

    (function () {

        // スマホ幅のときだけ実行
        if (!window.matchMedia("(max-width: 800px)").matches) {
            return;
        }

        // ▼テスト用：URLに ?nomerge を付けると連結機能を止められる
        if (location.search.indexOf("nomerge") !== -1) {
            return;
        }

        var container = document.getElementById("mobile-sections");
        if (!container) return;

        // 連結するページ（この順番で下に並ぶ）
        var pages = [
            "concept.html",
            "room.html",
            "amenities.html",
            "access.html",
            "contact.html"
        ];

        // セレクタの先頭にIDを付けて、
        // 他のセクションのCSSと衝突しないようにする
        function scopeSelector(sel, scopeId) {

            sel = sel.trim();

            if (!sel) return sel;

            if (sel === "*") {
                return "#" + scopeId + ", #" + scopeId + " *";
            }

            if (/^(body|html)/.test(sel)) {
                return sel.replace(/^(body|html)/, "#" + scopeId);
            }

            return "#" + scopeId + " " + sel;
        }

        function scopeRules(ruleList, scopeId) {

            Array.prototype.forEach.call(ruleList, function (rule) {

                if (rule.type === CSSRule.STYLE_RULE) {

                    rule.selectorText = rule.selectorText
                        .split(",")
                        .map(function (s) {
                            return scopeSelector(s, scopeId);
                        })
                        .join(", ");

                } else if (rule.cssRules) {

                    scopeRules(rule.cssRules, scopeId);
                }

            });
        }

        // 各ページを取得して、順番通りに連結する
        function loadSection(url, index) {

            return fetch(url)
                .then(function (res) {
                    return res.text();
                })
                .then(function (html) {

                    var doc = new DOMParser().parseFromString(html, "text/html");

                    // 重複するメニュー・ロゴ・戻るリンクは削除
                    doc.querySelectorAll(
                        "#menu, .menu-button, .top-menu, img.logo, footer, .back"
                    ).forEach(function (el) {
                        el.remove();
                    });

                    var scopeId = "mobile-embed-" + index;

                    var wrapper = document.createElement("div");
                    wrapper.id = scopeId;
                    wrapper.innerHTML = doc.body.innerHTML;

                    // CSSを衝突しないようスコープしてから反映
                    var styleTag = doc.querySelector("style");
                    if (styleTag) {

                        var styleEl = document.createElement("style");
                        styleEl.textContent = styleTag.textContent;
                        document.head.appendChild(styleEl);

                        if (styleEl.sheet) {
                            scopeRules(styleEl.sheet.cssRules, scopeId);
                        }
                    }

                    // roomページだけ、背景写真は不要なので消す
                    if (url === "room.html") {

                        var overrideStyle = document.createElement("style");
                        overrideStyle.textContent =
                            "#" + scopeId + " { background-image: none !important; background: #fff !important; }" +
                            "#" + scopeId + "::before { content: none !important; }";
                        document.head.appendChild(overrideStyle);
                    }

                    container.appendChild(wrapper);

                    // そのページ独自のスクリプト（スライダー等）を実行
                    var scriptTag = doc.querySelector("script");
                    if (scriptTag) {

                        var newScript = document.createElement("script");
                        newScript.textContent = scriptTag.textContent;
                        document.body.appendChild(newScript);
                    }

                })
                .catch(function (err) {
                    console.error("セクション読み込み失敗:", url, err);
                });
        }

        // 順番を保つため、1つずつ順番に読み込む
        var sectionsReady = pages.reduce(function (promise, url, index) {

            return promise.then(function () {
                return loadSection(url, index);
            });

        }, Promise.resolve());

        // =========================
        // メニューを押したら、別ページへ飛ばずに
        // 該当セクションまでスクロールする（スマホのみ）
        // =========================

        var scopeMap = {
            "concept.html": "mobile-embed-0",
            "room.html": "mobile-embed-1",
            "amenities.html": "mobile-embed-2",
            "access.html": "mobile-embed-3",
            "contact.html": "mobile-embed-4"
        };

        document.querySelectorAll("#menu a").forEach(function (link) {

            var href = link.getAttribute("href");

            // TOP：ページ上部へスクロール
            if (href === "index.html") {

                link.addEventListener("click", function (e) {
                    e.preventDefault();
                    closeMenu();
                    window.scrollTo({ top: 0, behavior: "smooth" });
                });

                return;
            }

            // CONCEPT〜CONTACT：該当セクションへスクロール
            if (scopeMap[href]) {

                link.addEventListener("click", function (e) {

                    e.preventDefault();
                    closeMenu();

                    sectionsReady.then(function () {

                        var target = document.getElementById(scopeMap[href]);

                        if (target) {
                            target.scrollIntoView({ behavior: "smooth", block: "start" });
                        }
                    });
                });
            }

            // RESERVATION（外部リンク）はそのまま通常動作
        });

    })();

    </script>


</body>
</html>
