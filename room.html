    <style>

        * {
            box-sizing: border-box;
        }


        /* =========================
           ページ全体
        ========================= */

        body {

            margin: 0;

            min-height: 100vh;

            background-image:
                url("images/room/room.jpg");

            background-size: cover;

            background-position: center;

            font-family:
                "Yu Mincho",
                "Hiragino Mincho ProN",
                serif;

            color: white;

            padding-bottom: 50px;

            padding-top: 80px;
        }


        /* =========================
           背景を薄くする
        ========================= */

        body::before {

            content: "";

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background:
                rgba(255, 255, 255, 0.60);

            z-index: -1;
        }


        /* =========================
           ロゴ
        ========================= */

        .logo {

            position: absolute;

            top: 10px;
            left: 10px;

            width: 250px;

            opacity: 1;
        }


        /* =========================
           右上 三本線
        ========================= */

        .menu-button {

            position: fixed;

            top: 30px;

            right: 35px;

            width: 45px;

            height: 45px;

            border: none;

            background:
                rgba(0, 0, 0, 0.45);

            color: white;

            font-size: 28px;

            cursor: pointer;

            border-radius: 50%;

            backdrop-filter: blur(5px);

            z-index: 100;
        }


        .menu-button:hover {

            background:
                rgba(0, 0, 0, 0.7);
        }


        /* =========================
           メニュー
        ========================= */

        .menu {

            position: fixed;

            top: 0;

            right: -300px;

            width: 300px;

            height: 100vh;

            background:
                rgba(0, 40, 60, 0.94);

            padding:
                100px 40px 40px;

            transition:
                right 0.4s ease;

            z-index: 200;

            box-shadow:
                -5px 0 25px
                rgba(0, 0, 0, 0.25);
        }


        /* メニューが開いた状態 */

        .menu.open {

            right: 0;
        }


        /* =========================
           メニュー項目
        ========================= */

        .menu a {

            display: block;

            color: white;

            text-decoration: none;

            font-size: 18px;

            letter-spacing: 4px;

            padding: 18px 0;

            border-bottom:
                1px solid
                rgba(255, 255, 255, 0.3);

            transition: 0.3s;
        }


        .menu a:hover {

            padding-left: 10px;

            background:
                rgba(255, 255, 255, 0.08);
        }


        /* =========================
           閉じるボタン
        ========================= */

        .close {

            position: absolute;

            top: 30px;

            right: 35px;

            font-size: 30px;

            color: white;

            cursor: pointer;
        }


        /* =========================
           TOPへ戻る
        ========================= */

        .back {

            display: block;

            width: fit-content;

            margin: 35px auto 0;

            color: white;

            text-decoration: none;

            padding: 12px 22px;

            border:
                1px solid
                rgba(255, 255, 255, 0.8);

            border-radius: 30px;

            background:
                rgba(0, 0, 0, 0.55);

            letter-spacing: 2px;

            backdrop-filter: blur(5px);

            transition: 0.3s;
        }


        .back:hover {

            background:
                rgba(0, 0, 0, 0.75);
        }


        /* =========================
           スマホ
        ========================= */

        @media (max-width: 800px) {


            

            body {

                padding-top: 56px;
            }

.logo {

                width: 180px;

                top: 20px;

                left: 20px;
            }


            /* 三本線 */

            .menu-button {

                top: 20px;

                right: 20px;

                width: 42px;

                height: 42px;

                font-size: 25px;
            }


            /* メニュー */

            .menu {

                width: 220px;

                padding:
                    90px 30px 30px;
            }


            .menu a {

                font-size: 15px;

                padding: 15px 0;
            }


            .close {

                top: 20px;

                right: 25px;
            }

        }

    </style>

    <script>


        /* =========================
           メニューを開く
        ========================= */

        function openMenu() {

            document
                .getElementById("menu")
                .classList
                .add("open");

        }


        /* =========================
           メニューを閉じる
        ========================= */

        function closeMenu() {

            document
                .getElementById("menu")
                .classList
                .remove("open");
