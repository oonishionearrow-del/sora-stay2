<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SORA｜ROOM</title>


    <style>

        * {
            box-sizing: border-box;
        }


        /* =========================
           ページ全体
        ========================= */

        body {

            margin: 0;

            min-height: 100vh;

            background-image:
                url("images/room.jpg");

            background-size: cover;

            background-position: center;

            font-family:
                "Yu Mincho",
                "Hiragino Mincho ProN",
                serif;

            color: white;

            padding-bottom: 50px;
        }


        /* =========================
           背景を薄くする
        ========================= */

        body::before {

            content: "";

            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 100%;

            background:
                rgba(255, 255, 255, 0.60);

            z-index: -1;
        }


        /* =========================
           ロゴ
        ========================= */

        .logo {

            position: absolute;

            top: 10px;
            left: 10px;

            width: 250px;

            opacity: 1;
        }


        /* =========================
           右上 三本線
        ========================= */

        .menu-button {

            position: fixed;

            top: 30px;

            right: 35px;

            width: 45px;

            height: 45px;

            border: none;

            background:
                rgba(0, 0, 0, 0.45);

            color: white;

            font-size: 28px;

            cursor: pointer;

            border-radius: 50%;

            backdrop-filter: blur(5px);

            z-index: 100;
        }


        .menu-button:hover {

            background:
                rgba(0, 0, 0, 0.7);
        }


        /* =========================
           メニュー
        ========================= */

        .menu {

            position: fixed;

            top: 0;

            right: -300px;

            width: 300px;

            height: 100vh;

            background:
                rgba(0, 40, 60, 0.94);

            padding:
                100px 40px 40px;

            transition:
                right 0.4s ease;

            z-index: 200;

            box-shadow:
                -5px 0 25px
                rgba(0, 0, 0, 0.25);
        }


        /* メニューが開いた状態 */

        .menu.open {

            right: 0;
        }


        /* =========================
           メニュー項目
        ========================= */

        .menu a {

            display: block;

            color: white;

            text-decoration: none;

            font-size: 18px;

            letter-spacing: 4px;

            padding: 18px 0;

            border-bottom:
                1px solid
                rgba(255, 255, 255, 0.3);

            transition: 0.3s;
        }


        .menu a:hover {

            padding-left: 10px;

            background:
                rgba(255, 255, 255, 0.08);
        }


        /* =========================
           閉じるボタン
        ========================= */

        .close {

            position: absolute;

            top: 30px;

            right: 35px;

            font-size: 30px;

            color: white;

            cursor: pointer;
        }


        /* =========================
           ROOM 見出し
        ========================= */

        .room-heading {

            text-align: center;

            margin-top: 150px;

            padding: 0 20px;
        }


        .room-heading-inner {

            display: inline-block;

            padding: 22px 40px;

            background:
                rgba(0, 30, 45, 0.4);

            border-radius: 10px;

            backdrop-filter: blur(4px);
        }


        .room-heading .en {

            font-size: 13px;

            letter-spacing: 0.4em;

            color: #8fe0ec;
        }


        .room-heading h2 {

            margin-top: 15px;

            font-size: clamp(32px, 6vw, 52px);

            font-weight: 300;

            letter-spacing: 0.15em;

            text-shadow:
                0 2px 12px rgba(0, 0, 0, 0.45);
        }


        .room-heading p {

            margin-top: 14px;

            font-size: 13px;

            letter-spacing: 0.08em;

            line-height: 1.9;

            text-shadow:
                0 1px 6px rgba(0, 0, 0, 0.35);
        }


        /* =========================
           スライド
        ========================= */

        .slider {

            position: relative;

            width: 90%;

            max-width: 1100px;

            margin: 60px auto 0;

            text-align: center;
        }


        /* =========================
           ROOM 説明文
        ========================= */

        .room-desc {

            max-width: 640px;

            margin: 55px auto 0;

            padding: 22px 30px;

            text-align: center;

            font-size: 14px;

            line-height: 2.2;

            letter-spacing: 0.03em;

            background:
                rgba(0, 30, 45, 0.4);

            border-radius: 10px;

            backdrop-filter: blur(4px);
        }


        /* =========================
           写真
        ========================= */

        .slider img {

            width: 100%;

            height: 600px;

            object-fit: cover;

            border-radius: 8px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.4);
        }


        /* =========================
           動画
        ========================= */

        .slider video {

            width: 100%;

            height: 600px;

            object-fit: contain;

            background:
                rgba(0, 0, 0, 0.3);

            border-radius: 8px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.4);
        }


        /* =========================
           左右の矢印
        ========================= */

        .arrow {

            position: absolute;

            top: 50%;

            transform:
                translateY(-50%);

            width: 45px;

            height: 45px;

            border: none;

            border-radius: 50%;

            background:
                rgba(0, 0, 0, 0.4);

            color: white;

            font-size: 28px;

            cursor: pointer;

            transition: 0.3s;

            z-index: 5;
        }


        .arrow:hover {

            background:
                rgba(0, 0, 0, 0.7);
        }


        /* =========================
           左の矢印
        ========================= */

        .prev {

            left: -60px;
        }


        /* =========================
           右の矢印
        ========================= */

        .next {

            right: -60px;
        }


        /* =========================
           ドット
        ========================= */

        .dots {

            margin-top: 18px;
        }


        .dot {

            display: inline-block;

            width: 9px;

            height: 9px;

            margin: 0 5px;

            border-radius: 50%;

            background:
                rgba(255, 255, 255, 0.5);

            cursor: pointer;
        }


        .dot.active {

            background: white;
        }


        /* =========================
           TOPへ戻る
        ========================= */

        .back {

            display: block;

            width: fit-content;

            margin: 35px auto 0;

            color: white;

            text-decoration: none;

            padding: 12px 22px;

            border:
                1px solid
                rgba(255, 255, 255, 0.8);

            border-radius: 30px;

            background:
                rgba(0, 0, 0, 0.55);

            letter-spacing: 2px;

            backdrop-filter: blur(5px);

            transition: 0.3s;
        }


        .back:hover {

            background:
                rgba(0, 0, 0, 0.75);
        }


        /* =========================
           スマホ
        ========================= */

        @media (max-width: 800px) {


            .logo {

                width: 180px;

                top: 20px;

                left: 20px;
            }


            /* 三本線 */

            .menu-button {

                top: 20px;

                right: 20px;

                width: 42px;

                height: 42px;

                font-size: 25px;
            }


            /* メニュー */

            .menu {

                width: 220px;

                padding:
                    90px 30px 30px;
            }


            .menu a {

                font-size: 15px;

                padding: 15px 0;
            }


            .close {

                top: 20px;

                right: 25px;
            }


            .room-heading {

                margin-top: 120px;
            }


            .room-heading-inner {

                padding: 18px 25px;
            }


            .room-heading h2 {

                font-size: 30px;
            }


            .room-heading p {

                font-size: 12px;
            }


            .slider {

                width: 92%;

                max-width: none;

                margin-top: 35px;
            }


            .slider img,
            .slider video {

                height: 320px;
            }


            .room-desc {

                margin-top: 40px;

                font-size: 13px;
            }


            .prev {

                left: -10px;
            }


            .next {

                right: -10px;
            }

        }

    </style>

</head>


<body>


    <!-- =========================
         ロゴ
    ========================= -->

    <img
        src="images/logo.png"
        alt="SORAのロゴ"
        class="logo"
    >


    <!-- =========================
         三本線メニューボタン
    ========================= -->

    <button
        class="menu-button"
        onclick="openMenu()"
    >

        ☰

    </button>


    <!-- =========================
         メニュー
    ========================= -->

    <div
        class="menu"
        id="menu"
    >


        <!-- 閉じる -->

        <div
            class="close"
            onclick="closeMenu()"
        >

            ×

        </div>


        <a href="index.html">
            TOP
        </a>


        <a href="concept.html">
            CONCEPT
        </a>


        <a href="room.html">
            ROOM
        </a>


        <a href="amenities.html">
            AMENITIES
        </a>


        <a href="access.html">
            ACCESS
        </a>


        <a href="contact.html">
            CONTACT
        </a>


    <!-- 予約 -->

    <a
        href="https://www.airbnb.jp/rooms/1693227146127960935?unique_share_id=e607aecd-bd02-41de-9335-cc84bdbd2808&viralityEntryPoint=1&s=76"
        target="_blank"
    >
        RESERVATION
    </a>


    </div>


    <!-- =========================
         ROOM 見出し
    ========================= -->

    <div class="room-heading">

        <div class="room-heading-inner">

            <div class="en">
                ROOM
            </div>

            <h2>
                お部屋紹介
            </h2>

            <p>
                ビーチリゾートのような、非日常のくつろぎ空間。
            </p>

        </div>

    </div>


    <!-- =========================
         スライド
    ========================= -->

    <div class="slider">


        <!-- 写真・動画を表示する場所 -->

        <div id="slideContent"></div>


        <!-- 左矢印 -->

        <button
            class="arrow prev"
            onclick="changeSlide(-1)"
        >

            ‹

        </button>


        <!-- 右矢印 -->

        <button
            class="arrow next"
            onclick="changeSlide(1)"
        >

            ›

        </button>


        <!-- ドット -->

        <div class="dots">

            <span
                class="dot active"
                onclick="showSlide(0)"
            ></span>

            <span
                class="dot"
                onclick="showSlide(1)"
            ></span>

            <span
                class="dot"
                onclick="showSlide(2)"
            ></span>

            <span
                class="dot"
                onclick="showSlide(3)"
            ></span>

            <span
                class="dot"
                onclick="showSlide(4)"
            ></span>

        </div>

    </div>


    <!-- =========================
         ROOM 説明文
    ========================= -->

    <p class="room-desc">

        ターコイズとホワイトを基調にコーディネートした、
        海辺のリゾートホテルのような客室。<br>
        最大6名様まで宿泊可能で、ご家族やグループ旅行にもおすすめです。

    </p>


    <!-- =========================
         TOPへ戻る
    ========================= -->

    <a
        href="index.html"
        class="back"
    >

        ← TOPへ戻る

    </a>


    <script>


        /* =========================
           メニューを開く
        ========================= */

        function openMenu() {

            document
                .getElementById("menu")
                .classList
                .add("open");

        }


        /* =========================
           メニューを閉じる
        ========================= */

        function closeMenu() {

            document
                .getElementById("menu")
                .classList
                .remove("open");

        }


        /* =========================
           写真4枚＋動画1本
        ========================= */

        const slides = [

            {
                type: "image",
                src: "images/room1.jpg"
            },

            {
                type: "image",
                src: "images/room2.jpg"
            },

            {
                type: "image",
                src: "images/room3.jpg"
            },

            {
                type: "image",
                src: "images/room4.jpg"
            },

            {
                type: "video",
                src: "images/room.mp4"
            }

        ];


        /* =========================
           現在のスライド
        ========================= */

        let currentSlide = 0;


        /* =========================
           スライドを表示
        ========================= */

        function showSlide(number) {

            currentSlide = number;


            const content =
                document.getElementById(
                    "slideContent"
                );


            /* 中身を空にする */

            content.innerHTML = "";


            /* =========================
               写真
            ========================= */

            if (
                slides[currentSlide].type
                === "image"
            ) {

                const image =
                    document.createElement(
                        "img"
                    );


                image.src =
                    slides[currentSlide].src;


                image.alt =
                    "SORAのお部屋";


                content.appendChild(image);

            }


            /* =========================
               動画
            ========================= */

            if (
                slides[currentSlide].type
                === "video"
            ) {

                const video =
                    document.createElement(
                        "video"
                    );


                video.src =
                    slides[currentSlide].src;


                /* 自動再生 */

                video.autoplay = true;


                /* ミュート */

                video.muted = true;


                /* スマホ対応 */

                video.playsInline = true;


                /* 再生バー */

                video.controls = true;


                content.appendChild(video);

            }


            /* =========================
               ドット変更
            ========================= */

            const dots =
                document.querySelectorAll(
                    ".dot"
                );


            dots.forEach(
                function(dot, index) {

                    dot.classList.toggle(
                        "active",
                        index === currentSlide
                    );

                }
            );

        }


        /* =========================
           左右の矢印
        ========================= */

        function changeSlide(direction) {

            currentSlide += direction;


            /* 最後 → 最初 */

            if (
                currentSlide >=
                slides.length
            ) {

                currentSlide = 0;

            }


            /* 最初 → 最後 */

            if (
                currentSlide < 0
            ) {

                currentSlide =
                    slides.length - 1;

            }


            showSlide(currentSlide);

        }


        /* =========================
           スワイプで写真を切り替える
        ========================= */

        (function () {

            const sliderEl = document.querySelector(".slider");

            let startX = 0;
            let startY = 0;

            sliderEl.addEventListener("touchstart", function (e) {

                startX = e.touches[0].clientX;
                startY = e.touches[0].clientY;

            }, { passive: true });

            sliderEl.addEventListener("touchend", function (e) {

                const endX = e.changedTouches[0].clientX;
                const endY = e.changedTouches[0].clientY;

                const diffX = endX - startX;
                const diffY = endY - startY;

                /* 縦スクロールと区別するため、
                   横方向の動きが大きいときだけ反応 */

                if (
                    Math.abs(diffX) > 40 &&
                    Math.abs(diffX) > Math.abs(diffY)
                ) {

                    if (diffX < 0) {
                        changeSlide(1);
                    } else {
                        changeSlide(-1);
                    }
                }

            }, { passive: true });

        })();


        /* =========================
           最初の写真を表示
        ========================= */

        showSlide(0);


    </script>


</body>

</html>
